name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/lint.yml@c8fecea588e8f72584227afe508c3c9b38bbacc3 # repo-standard 334d366
  aislop:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/aislop.yml@c8fecea588e8f72584227afe508c3c9b38bbacc3 # repo-standard 334d366
  security:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/security.yml@c8fecea588e8f72584227afe508c3c9b38bbacc3 # repo-standard 334d366
  standard:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/standard.yml@c8fecea588e8f72584227afe508c3c9b38bbacc3 # repo-standard 334d366
  coverage:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/simpsonm09-repo-standard/.github/workflows/coverage.yml@c8fecea588e8f72584227afe508c3c9b38bbacc3 # repo-standard 334d366

  test:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: Install and test
        run: |
          pip install -e '.[test]'
          pytest
