[tools]

# Task runner
"aqua:casey/just" = "1.58.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"
python = "3.12"

# Linters
"aqua:grafana/flint" = "0.22.14"
ruff = "0.16.9"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"

[tasks.test]
description = "Run the tests"
run = "python -m pytest"

[tasks.coverage]
description = "Run the tests with an lcov coverage report"
run = 'python -m pytest --cov=src --cov-branch --cov-report=lcov:coverage/lcov.info'
